<style>

    :root:not([data-theme="light"]) {
      --fundo: #141416; --painel: #1d1d21; --texto: #ececef; --suave: #a3a3ad; --linha: #34343a;
      --destaque: #ff8a3d; --destaque-suave: #3a2416; --codigo-fundo: #0f1117; --codigo-texto: #e6e6e6;

    --fundo: #141416; --painel: #1d1d21; --texto: #ececef; --suave: #a3a3ad; --linha: #34343a;

  header h1 span { color: var(--destaque); }

  .modulo { color: var(--destaque); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }

  .legenda { margin-top: 16px; background: var(--painel); border: 1px solid var(--linha); border-radius: 14px;
             padding: 14px 18px; font-size: 17px; }
  .legenda span { color: var(--suave); }
  .legenda span.dita { color: var(--texto); }
  .legenda span.falando { color: var(--texto); background: var(--destaque-suave); border-radius: 4px; }
  .legenda .quem { font-weight: 700; color: var(--destaque); }
  pre { background: var(--codigo-fundo); color: var(--codigo-texto); padding: 14px 16px; border-radius: 10px;

<!-- ============================================================ VISUAIS DAS CENAS -->
<template id="v-abertura">
  <div class="grande">EJ Quest</div>
  <p style="font-size:19px">Gestão do conhecimento gamificada para Empresas Juniores.<br>
  Projeto de <b>Banco de Dados 2</b> (persistência poliglota) e base de <b>Programação Web 1</b>.</p>
  <div class="grade" style="margin-top:18px">
    <div class="cartao"><h4>1 · Visão e arquitetura</h4>problema, poliglota, camadas, execução</div>
    <div class="cartao"><h4>2 · Modelagem e schema</h4>ER, 3FN, restrições, índice</div>
    <div class="cartao"><h4>3 · Regras no banco</h4>views, triggers, procedures</div>
    <div class="cartao"><h4>4 · Transações</h4>ACID, FOR UPDATE, isolamento, WAL</div>
    <div class="cartao"><h4>5 · Carga, API e Redis</h4>140 mil tentativas, Cache-Aside, Sorted Set</div>
    <div class="cartao"><h4>6 · Prova e banca</h4>testes, números e simulação da apresentação</div>
  </div>
</template>

<template id="v-problema">
  <div class="grade">
    <div class="cartao"><h4 class="erro">O problema</h4>A cada troca de gestão, a EJ perde conhecimento. Trainees aprendem de forma solta, sem trilha, sem acompanhamento e sem motivação.</div>
    <div class="cartao"><h4 class="ok">A solução</h4>Trilhas por diretoria, com módulos, lições, quizzes e um desafio final avaliado pelo gestor. Cada aprovação vira pontos e entra num ranking.</div>
    <div class="cartao"><h4>Quem usa</h4>Membro: estuda, envia o desafio, acompanha o progresso.<br>Gestor: avalia entregas da sua diretoria.<br>Gestor geral: administra tudo.</div>
  </div>
</template>

<template id="v-poliglota">
  <div class="grade">
    <div class="cartao" style="border-color:var(--azul)"><h4>PostgreSQL · o livro-caixa</h4>Fonte oficial. Usuários, trilhas, tentativas, conclusões e pontos. Integridade, transações ACID, views, procedures e triggers.</div>
    <div class="cartao" style="border-color:var(--erro)"><h4>Redis · o quadro branco</h4>Cópias derivadas e descartáveis: o top 100 do ranking (string JSON, 60 s) e o placar com a posição de cada um (Sorted Set).</div>
  </div>
  <div class="aviso">Se alguém apagar o quadro, a gente refaz olhando o livro-caixa. O contrário nunca acontece.</div>
  <table style="margin-top:12px"><tr><th>Exigência da especificação de BD2</th><th>No EJ Quest</th></tr>
    <tr><td>Relacional + NoSQL com divisão justificável</td><td>PostgreSQL 16 + Redis 7</td></tr>
    <tr><td>Justificativa do NoSQL</td><td>Caching de alta velocidade e placar de líderes</td></tr>
    <tr><td>Padrão de sincronização</td><td>Cache-Aside e Write-Through</td></tr></table>
</template>

<template id="v-participacao">
  <div class="fluxo">
    <div class="caixa">usuario 12<br><small>Gabriel</small></div><span class="seta">→</span>
    <div class="caixa">matricula 40<br><small>trilha Fundamentos</small></div><span class="seta">→</span>
    <div class="caixa api">participacao 300<br><small>matrícula × Desafio</small></div><span class="seta">→</span>
    <div class="caixa">tentativa 1 → ajustes<br>tentativa 2 → aprovada</div><span class="seta">→</span>
    <div class="caixa">conclusao<br><small>PK = participação 300</small></div><span class="seta">→</span>
    <div class="caixa">pontuacao<br><small>PK = participação 300 · 80 pts</small></div>
  </div>
  <ol style="margin-top:18px">
    <li><b>Agrupa</b> as tentativas do mesmo membro na mesma avaliação.</li>
    <li><b>Garante unicidade</b>: <code>UNIQUE (id_matricula, id_avaliacao)</code>.</li>
    <li>É a <b>linha travada</b> na aprovação (<code>FOR UPDATE</code>).</li>
    <li>É a <b>chave primária</b> de <code>conclusao</code> e <code>pontuacao</code>: duas conclusões para a mesma participação são impossíveis.</li>
  </ol>
</template>

<template id="v-3fn">
  <div class="grade">
    <div class="cartao"><h4 class="erro">Errado</h4><code>tentativa_avaliacao (id, id_participacao, <b>id_usuario</b>, ...)</code><p>O usuário já é alcançado por tentativa → participação → matrícula → usuário. Guardar de novo permite uma tentativa dizer "usuário 12" enquanto a matrícula diz "usuário 15".</p></div>
    <div class="cartao"><h4 class="ok">Certo</h4><code>tentativa_avaliacao</code> e <code>pontuacao</code> <b>não</b> têm <code>id_usuario</code>. Total de pontos, progresso e posição são <b>calculados</b> por views.</div>
  </div>
  <div class="aviso"><b>O preço da 3FN:</b> mais JOINs. O ranking anda <code>pontuacao → participacao → matricula → usuario</code>. A view organiza, o índice acelera e o cache evita repetir: a normalização cria o problema que o resto da disciplina resolve.</div>
</template>

<template id="v-restricoes">
<pre><span class="c">-- RN01: e-mail único sem diferenciar maiúsculas</span>
<span class="k">CREATE UNIQUE INDEX</span> usuario_email_uk <span class="k">ON</span> usuario (lower(email));

<span class="c">-- RN05: no máximo UMA alternativa correta por questão (índice único PARCIAL)</span>
<span class="k">CREATE UNIQUE INDEX</span> alternativa_uma_correta_uk <span class="k">ON</span> alternativa (id_questao) <span class="k">WHERE</span> correta;

<span class="c">-- RN04: matrícula única por usuário e trilha</span>
<span class="k">CONSTRAINT</span> matricula_uk <span class="k">UNIQUE</span> (id_usuario, id_trilha)

<span class="c">-- RN17: histórico não se apaga</span>
id_usuario bigint <span class="k">NOT NULL REFERENCES</span> usuario (id_usuario) <span class="k">ON DELETE RESTRICT</span></pre>
  <table><tr><th>Restrição</th><th>Impede</th></tr>
    <tr><td>PRIMARY KEY</td><td>linha repetida ou sem identidade</td></tr>
    <tr><td>FOREIGN KEY</td><td>referência a algo que não existe</td></tr>
    <tr><td>UNIQUE</td><td>duplicidade</td></tr>
    <tr><td>CHECK / NOT NULL</td><td>valor proibido ou vazio</td></tr></table>
</template>

<template id="v-fkcomposta">
<pre><span class="c">-- conclusao: a tentativa que conclui a participação TEM que ser dela</span>
<span class="k">CONSTRAINT</span> conclusao_tentativa_da_participacao_fk
    <span class="k">FOREIGN KEY</span> (id_participacao, id_tentativa)
    <span class="k">REFERENCES</span> tentativa_avaliacao (id_participacao, id_tentativa)

<span class="c">-- resposta_tentativa: a alternativa escolhida existe NAQUELA questão</span>
<span class="k">CONSTRAINT</span> resposta_alternativa_fk
    <span class="k">FOREIGN KEY</span> (id_questao, numero_alternativa)
    <span class="k">REFERENCES</span> alternativa (id_questao, numero)</pre>
  <p>Para a FK composta funcionar, o lado referenciado precisa de <code>UNIQUE</code> no par. Por isso existe <code>UNIQUE (id_participacao, id_tentativa)</code>, que parece redundante e não é.</p>
</template>

<template id="v-null">
<pre><span class="c">-- 1ª versão: parecia certa</span>
<span class="k">CHECK</span> ((tipo = <span class="s">'quiz'</span> <span class="k">AND</span> percentual_minimo <span class="k">BETWEEN</span> 0 <span class="k">AND</span> 100) <span class="k">OR</span>
       (tipo = <span class="s">'projeto'</span> <span class="k">AND</span> percentual_minimo <span class="k">IS NULL</span>))

<span class="c">-- quiz com percentual_minimo NULL:</span>
<span class="c">--   NULL BETWEEN 0 AND 100  →  NULL</span>
<span class="c">--   NULL OR FALSE           →  NULL   →  o CHECK ACEITA!</span>

<span class="h"><span class="c">-- correção</span></span>
<span class="k">CHECK</span> ((tipo = <span class="s">'quiz'</span> <span class="k">AND</span> percentual_minimo <span class="k">IS NOT NULL AND</span> percentual_minimo <span class="k">BETWEEN</span> 0 <span class="k">AND</span> 100) <span class="k">OR</span> ...)</pre>
  <p><span class="erro">Teste 10: FALHOU, o banco aceitou</span> → corrigido → <span class="ok">OK, recusado</span>. A mesma armadilha existia no parecer obrigatório do pedido de ajustes.</p>
</template>

<template id="v-indice">
  <table><tr><th>Consulta</th><th>Sem índice</th><th>Com índice</th></tr>
    <tr><td>Histórico de uma participação (índice <b>planejado</b>)</td><td>0,25 ms</td><td>0,28 ms · <span class="erro">nenhum ganho</span></td></tr>
    <tr><td>20 entregas mais recentes (<code>idx_tentativa_enviada_em</code>)</td><td>53,0 ms · Seq Scan</td><td><b class="ok">0,26 ms</b> · Index Scan Backward</td></tr>
    <tr><td>Entregas dos últimos 30 dias (8,9% das linhas)</td><td>36,7 ms · Seq Scan</td><td><b class="ok">12,1 ms</b> · Index Only Scan</td></tr></table>
<pre><span class="k">EXPLAIN</span> (<span class="k">ANALYZE</span>, <span class="k">BUFFERS</span>) <span class="k">SELECT</span> id_tentativa, enviada_em
<span class="k">FROM</span> tentativa_avaliacao <span class="k">ORDER BY</span> enviada_em <span class="k">DESC LIMIT</span> 20;</pre>
  <div class="aviso">Índice que não ajuda só custa: ocupa disco e deixa todo INSERT mais lento. O planejado saiu (DEC-010).</div>
</template>

<template id="v-views">
<pre><span class="k">CREATE VIEW</span> vw_ranking_consolidado <span class="k">AS</span>
<span class="k">SELECT</span> u.id_usuario, u.nome,
       <span class="k">SUM</span>(p.pontos)::int  <span class="k">AS</span> total_pontos,
       <span class="k">MAX</span>(p.concedida_em) <span class="k">AS</span> ultima_concessao
<span class="k">FROM</span> pontuacao p
<span class="k">JOIN</span> participacao_avaliacao pa <span class="k">ON</span> pa.id_participacao = p.id_participacao
<span class="k">JOIN</span> matricula m               <span class="k">ON</span> m.id_matricula     = pa.id_matricula
<span class="k">JOIN</span> usuario u                 <span class="k">ON</span> u.id_usuario       = m.id_usuario
<span class="k">WHERE</span> u.ativo                 <span class="c">-- RN17: desligado sai do ranking</span>

<template id="v-trigger">
<pre><span class="k">CREATE FUNCTION</span> fn_conceder_pontos() <span class="k">RETURNS trigger LANGUAGE</span> plpgsql <span class="k">AS</span> $$
<span class="k">BEGIN</span>
    <span class="k">INSERT INTO</span> pontuacao (id_participacao, pontos, concedida_em)
    <span class="k">SELECT</span> <span class="h">NEW.id_participacao</span>, a.pontos_previstos, <span class="h">NEW.concluida_em</span>
    <span class="k">FROM</span> participacao_avaliacao pa <span class="k">JOIN</span> avaliacao a <span class="k">ON</span> a.id_avaliacao = pa.id_avaliacao
    <span class="k">WHERE</span> pa.id_participacao = NEW.id_participacao;
    <span class="k">RETURN</span> NEW;
<span class="k">END</span>; $$;

<span class="k">CREATE TRIGGER</span> trg_conclusao_pontua
    <span class="k">AFTER INSERT ON</span> conclusao
    <span class="k">FOR EACH ROW EXECUTE FUNCTION</span> fn_conceder_pontos();</pre>
  <p><b>AFTER INSERT</b>: roda depois que a conclusão entrou. <b>FOR EACH ROW</b>: uma vez por linha. <b>NEW</b>: a linha nova. Roda <b>na mesma transação</b>: conclusão e pontos entram juntos ou nenhum entra.</p>
</template>

    <span class="k">RAISE EXCEPTION</span> <span class="s">'% é histórico e não pode ser alterado nem apagado (RN18)'</span>, TG_TABLE_NAME

 apagar uma conclusão               | OK, recusado [EJ409]: conclusao é histórico e não pode ser alterado nem apagado (RN18)</span></pre>

<span class="k">END</span>; $$;

<template id="v-isolamento">
  <table><tr><th>Nível ANSI</th><th>No PostgreSQL</th></tr>
    <tr><td>Read Uncommitted</td><td>Funciona como Read Committed: nunca há dirty read</td></tr>
    <tr><td><b>Read Committed</b> (padrão)</td><td>Cada comando vê o que já foi confirmado. <b>É o que o projeto usa</b>, com <code>FOR UPDATE</code></td></tr>
    <tr><td>Repeatable Read</td><td>Snapshot Isolation (MVCC): impede phantom, permite write skew</td></tr>
    <tr><td>Serializable</td><td>SSI: impede tudo, mas aborta transações em conflito, que precisam ser repetidas</td></tr></table>
  <div class="grade" style="margin-top:14px">
    <div class="cartao"><h4>Strict 2PL</h4>O lock X do <code>FOR UPDATE</code> fica até o COMMIT ou ROLLBACK.</div>
    <div class="cartao"><h4>Deadlock</h4>Cada transação trava uma linha só: sem ciclo. Se houvesse, o PostgreSQL detecta (1 s) e aborta uma.</div>
    <div class="cartao"><h4>WAL</h4>Log antes dos dados. Na queda, o PostgreSQL faz só REDO; o MVCC dispensa o UNDO.</div>
  </div>
</template>

  <span class="k">try</span> {
    <span class="k">await</span> client.query(<span class="s">'BEGIN'</span>);

}</pre>

  { m: 'Abertura', t: 'Bem-vindo à videoaula do EJ Quest', v: 'v-abertura', f: [

  { m: 'Visão', t: 'O problema e a solução', v: 'v-problema', f: [

  { m: 'Visão', t: 'Persistência poliglota: o livro-caixa e o quadro branco', v: 'v-poliglota', f: [

    'A justificativa técnica do Redis é exatamente uma das que o professor lista: caching de alta velocidade e placar de líderes.'] },
  { m: 'Visão', t: 'As camadas da API', v: 'v-camadas', f: [

  { m: 'Visão', t: 'A estrutura do repositório', v: 'v-estrutura', f: [
    'O repositório é um monorepo com três partes: db para o SQL, api para o back-end e web para o front.',
    'Na pasta db, os scripts são numerados e rodam em ordem: schema, índices, views, regras e povoamento. A pasta testes guarda os testes do banco.',

  { m: 'Visão', t: 'Rodando o projeto', v: 'v-executar', f: [

    'O script recriar banco apaga tudo e roda os cinco arquivos SQL em uns vinte e cinco segundos. No fim, ele mostra as contagens: cento e quarenta mil, quinhentas e setenta e quatro tentativas.',
    'A rota saúde confirma que a API fala com os dois bancos.'] },
  { m: 'Modelagem', t: 'Do MER às 16 tabelas', v: 'v-tabelas', f: [
    'A aula dois revisou a tradução do modelo conceitual para o relacional. O EJ Quest segue as regras à risca.',
    'Entidades viram tabelas. Relacionamento um para muitos vira chave estrangeira no lado muitos, como o módulo apontando para a trilha.',
    'Relacionamento muitos para muitos vira tabela associativa. Vínculo diretoria liga usuário e diretoria, e ainda guarda o papel. Matrícula liga usuário e trilha.',
    'São dezesseis tabelas em quatro grupos: acesso, conteúdo, participação e recompensa.'] },
  { m: 'Modelagem', t: 'A peça-chave: participação na avaliação', v: 'v-participacao', f: [
    'Se o professor perguntar qual tabela é a mais importante, a resposta é participação avaliação.',
    'Siga o Gabriel. Ele tem uma matrícula na trilha. A matrícula com a avaliação desafio forma a participação trezentos. Nela ficam as tentativas: a primeira recebeu ajustes, a segunda foi aprovada.',
    'A participação faz quatro coisas. Agrupa as tentativas. Garante que o par matrícula e avaliação só existe uma vez. É a linha travada na aprovação. E é a chave primária da conclusão e da pontuação.',
    'Esse último ponto é o mais forte: como chave primária não repete, é impossível existir duas conclusões para a mesma participação, mesmo com bug na API.'] },
  { m: 'Modelagem', t: 'Terceira forma normal', v: 'v-3fn', f: [
    'Normalizar é guardar cada fato num lugar só.',
    'O exemplo clássico do projeto: a tentativa não guarda o usuário. Ele é alcançado pela participação e pela matrícula. Se guardasse de novo, uma tentativa poderia dizer usuário doze enquanto a matrícula dela diz usuário quinze. Isso é dependência transitiva, e a terceira forma normal elimina.',
    'O preço são mais JOINs. E aqui está a frase que vale guardar para a apresentação: a normalização cria o problema que o resto da disciplina resolve. A view organiza, o índice acelera e o cache evita repetir.'] },
  { m: 'Schema', t: 'Restrições: o banco se defendendo', v: 'v-restricoes', f: [
    'Agora o código. O banco não confia na API: ele se defende com restrições.',

    'Na alternativa, um índice único parcial: só as linhas com correta igual a verdadeiro entram no índice. Resultado: no máximo uma alternativa correta por questão.',
    'E toda chave estrangeira usa on delete restrict. Apagar um usuário com histórico é recusado. Desligar é mudar ativo para falso.'] },
  { m: 'Schema', t: 'Chave estrangeira composta', v: 'v-fkcomposta', f: [
    'Duas restrições merecem destaque, porque mostram domínio do assunto.',
    'Na conclusão, a chave estrangeira composta garante que a tentativa que conclui a participação pertence a ela. Sem isso, daria para concluir a participação do Gabriel com a tentativa da Ana.',
    'Na resposta, a chave composta garante que a alternativa escolhida existe naquela questão.',
    'Detalhe técnico: para a chave composta funcionar, o lado referenciado precisa de unique no par. Por isso a tentativa tem um unique que parece redundante, e não é.'] },
  { m: 'Schema', t: 'A armadilha do NULL no CHECK', v: 'v-null', f: [
    'Esta é uma história ótima para contar, porque mostra que os testes servem para achar erro.',
    'A regra era: quiz precisa de nota mínima, desafio não tem. A primeira versão do check parecia certa.',
    'Mas um check só recusa quando a expressão dá falso. Se der nulo, ele aceita. Com a nota nula, nulo between zero e cem dá nulo, e nulo ou falso dá nulo. O check aceitou.',
    'O teste dez mostrou: falhou, o banco aceitou. A correção foi exigir is not null. E o mesmo erro existia no parecer obrigatório dos ajustes, que também foi corrigido.'] },
  { m: 'Schema', t: 'Índice: medir antes de afirmar', v: 'v-indice', f: [
    'O planejamento previa um índice por participação e data de envio. Eu medi: zero vírgula vinte e cinco milissegundos sem ele e zero vírgula vinte e oito com ele. Nenhum ganho.',
    'O motivo: os uniques que começam pela participação já tinham criado índices, e o planejador usou um deles. Índice que não ajuda só custa, porque deixa todo insert mais lento. Ele saiu.',
    'Entrou um índice na data de envio, para o painel do gestor. As vinte entregas mais recentes caem de cinquenta e três milissegundos, com varredura completa, para zero vírgula vinte e seis, lendo o índice de trás para frente.',
    'Já a contagem dos últimos trinta dias ganha menos, cerca de três vezes, porque pega quase nove por cento da tabela. Quanto mais seletiva a consulta, mais o índice ajuda.'] },
  { m: 'Regras no banco', t: 'Views', v: 'v-views', f: [
    'A aula cinco trata de três objetos programáveis: views, procedures e triggers. Vamos um por um.',
    'A view do ranking esconde o caminho dos três JOINs e filtra quem está ativo. Desligado sai do ranking, mas o histórico fica.',
    'Pelas categorias da aula, as três views do projeto são complexas, porque têm JOIN e agrupamento. Nenhuma é materializada. E não são atualizáveis: insert numa view com group by dá erro. É exatamente a questão um do quiz da aula.',
    'E lembre: view não deixa nada mais rápido. Ela organiza. Quem acelera é o índice e o cache.'] },
  { m: 'Regras no banco', t: 'Trigger AFTER: os pontos nascem com a conclusão', v: 'v-trigger', f: [
    'A trigger de pontos dispara depois de cada insert em conclusão, uma vez por linha.',
    'Ela lê a pseudo tabela NEW, que é a linha recém inserida, busca quantos pontos a avaliação vale, e insere a pontuação com o mesmo horário da conclusão. Esse horário é o desempate do ranking.',
    'O ponto principal: a trigger roda dentro da mesma transação. Se ela falhar, a conclusão também é desfeita. Conclusão sem pontos, ou pontos sem conclusão, não existe.',
    'E por que trigger? Porque assim qualquer caminho que crie uma conclusão gera os pontos: a procedure, a carga ou um insert manual.'] },
  { m: 'Regras no banco', t: 'Trigger BEFORE: o histórico é imutável', v: 'v-imutavel', f: [
    'Depois de ler a aula cinco, entrou uma segunda trigger, de outro tipo.',
    'Ela dispara antes de update ou delete em resultado, conclusão e pontuação, e cancela a operação levantando um erro. É a regra dezoito: o histórico não se altera nem se apaga.',
    'Repare que a função devolve OLD. Em update e delete existe OLD, a linha como estava. Em delete não existe NEW: é a questão seis do quiz da aula.',
    'A aula diz: se der para resolver com constraint, prefira constraint. Aqui não dá, porque constraint proíbe valores, não operações. Por isso a trigger.'] },
  { m: 'Regras no banco', t: 'A procedure de aprovação', v: 'v-procedure', f: [
    'A procedure sp aprovar projeto é o coração da avaliação. O prefixo s p segue a boa prática da aula cinco.',
    'Ela é chamada com CALL. Recebe a tentativa, o avaliador e o parecer como parâmetros de entrada, e devolve o status num parâmetro INOUT, que entra nulo e sai preenchido.',
    'São seis passos. Primeiro, trava a participação com for update. Segundo, valida a permissão: precisa ser desafio, não pode ser o dono da entrega, e precisa ser gestor da diretoria. Terceiro, se já existe conclusão, devolve já aprovada e para. Isso é idempotência.',
    'Quarto e quinto, grava o resultado e a conclusão, e a trigger dá os pontos. Sexto, devolve aprovada.',
    'A procedure não faz commit. Quem abre e fecha a transação é a API. Assim tudo confirma ou desfaz junto.'] },
  { m: 'Transações', t: 'ACID no EJ Quest', v: 'v-acid', f: [
    'A aula seis trata de transações, concorrência e recuperação. Comece pelo ACID.',
    'Atomicidade: o teste provoca uma falha depois da procedure. Dentro da transação aparecem um resultado, uma conclusão e uma pontuação. Depois do rollback, zero, zero e zero.',
    'Consistência: vinte e cinco operações proibidas e vinte e cinco recusas.',
    'Isolamento: o for update faz a segunda aprovação esperar a primeira.',
    'Durabilidade: o commit só responde depois de o log, o WAL, ir para o disco. É o mito comum da aula: o commit não grava as páginas de dados na hora, grava o log.'] },
  { m: 'Transações', t: 'Lost update e o FOR UPDATE', v: 'v-lostupdate', f: [
    'A pergunta disparadora da aula seis é: dois clientes compram o mesmo assento no mesmo milissegundo, como garantir que só um consegue?',
    'No EJ Quest, é: dois gestores aprovam a mesma entrega no mesmo segundo. Sem trava, os dois leriam que não há conclusão, e os dois gravariam. É a atualização perdida.',
    'A sessão A trava a linha da participação. A sessão B chega e fica esperando. Quando A confirma, B destrava, relê, vê a conclusão e devolve já aprovada.',
    'Isso é exatamente o cenário A do script de laboratório que o professor passou: bloqueio pessimista com select for update.'] },
  { m: 'Transações', t: 'A prova real: duas sessões', v: 'v-duassessoes', f: [
    'Isso não é teoria. O script testar banco roda duas sessões de verdade.',
    'A sessão A aprova e segura a trava por três segundos. A sessão B chega um segundo depois e fica parada. Quando A faz commit, B destrava seis milissegundos depois e recebe já aprovada.',
    'No fim: um resultado, uma conclusão e uma pontuação.',
    'Na demo ao vivo, abra uma terceira janela durante a espera e rode a consulta de bloqueios do laboratório da aula. Ela mostra que a sessão B está bloqueada pelo processo da sessão A.'] },
  { m: 'Transações', t: 'Isolamento, 2PL, deadlock e WAL no PostgreSQL', v: 'v-isolamento', f: [
    'Agora o que o livro não conta sobre o PostgreSQL.',
    'Read uncommitted, nele, funciona como read committed: nunca existe leitura suja. Read committed é o padrão, e é o que o projeto usa. Repeatable read é implementado como snapshot isolation. E serializable usa SSI, que aborta transações em conflito.',
    'O for update pega um lock exclusivo, que só sai no commit ou rollback. É o protocolo de duas fases rigoroso da aula.',
    'Deadlock precisa de ciclo. Cada transação do projeto trava uma linha só, então não forma ciclo. Se formasse, o PostgreSQL detecta em cerca de um segundo e aborta uma.',
    'E na queda do servidor, o PostgreSQL só refaz, a fase REDO. Ele não precisa da fase UNDO do algoritmo ARIES, porque com o MVCC as versões de transações não confirmadas simplesmente ficam invisíveis.'] },
  { m: 'Carga', t: '140 mil tentativas reprodutíveis', v: 'v-carga', f: [
    'A especificação exige pelo menos cem mil registros na entidade principal. O projeto tem cento e quarenta mil tentativas.',
    'A técnica é generate series: um insert select sobre uma série de números cria milhares de linhas num comando só.',
    'Para cada participação, sorteia-se quantas tentativas ela tem, e um cross join lateral gera essas linhas.',
    'A carga é reprodutível: semente fixa e paralelismo desligado. Rodar de novo gera exatamente os mesmos dados.',
    'E ela respeita as regras: a nota vem das respostas, só a última tentativa pode ser aprovada, e os pontos nascem da mesma trigger da API.'] },
  { m: 'API', t: 'Uma requisição de ponta a ponta', v: 'v-requisicao', f: [
    'Agora siga uma aprovação pela API.',
    'O index aplica o CORS, lê o corpo e o cabeçalho com o usuário. A rota valida o identificador e chama o serviço. O serviço abre a transação e chama o repositório, que executa o CALL da procedure com parâmetros.',
    'Se a procedure recusar, ela levanta um código próprio, como EJ quatrocentos e três. O arquivo erros traduz para o HTTP certo, sem vazar detalhe interno.',
    'A resposta diz o status e se o Redis foi atualizado: o ranking invalidado e o placar atualizado.'] },
  { m: 'API', t: 'A transação na API e a injeção de SQL', v: 'v-transacao', f: [
    'A função em transação é pequena e importante.',
    'Ela reserva uma conexão do pool. Por quê? Porque begin, call e commit precisam ir pela mesma conexão. Se cada comando pegasse uma conexão livre qualquer, a transação não valeria nada.',
    'Se der erro, ela faz rollback, e no finally sempre devolve a conexão ao pool.',
    'E compare com a aula doze de Programação Web: lá o valor é colado no texto do SQL, o que abre porta para injeção. Aqui, o valor vai separado, com dólar um. O banco nunca interpreta o parecer como comando.'] },
  { m: 'Redis', t: 'Cache-Aside no top 100', v: 'v-cacheaside', f: [
    'O primeiro padrão de sincronização é o Cache-Aside, no top cem do ranking.',
    'A API pergunta ao Redis, com limite de trezentos milissegundos. Se achou, devolve com origem cache. Se não achou, consulta a view no PostgreSQL, grava no Redis por sessenta segundos e devolve com origem postgres.',
    'Na aprovação, primeiro o commit, depois o delete da chave. Se o delete viesse antes, outra leitura poderia regravar no Redis a versão sem os pontos novos.',
    'O pior caso é um ranking atrasado em até sessenta segundos. Atrasado, nunca inventado.'] },
  { m: 'Redis', t: 'Sorted Set e Write-Through', v: 'v-sortedset', f: [
    'O segundo padrão veio direto da especificação: para gamificação, o professor sugere Sorted Sets como placar de líderes.',
    'Sorted Set é um conjunto em que cada membro tem uma nota, e o Redis mantém tudo sempre ordenado. A posição de qualquer pessoa sai em tempo logarítmico: uns treze passos para quase seis mil participantes.',
    'A regra do ranking cabe num número só: os pontos multiplicados por dez bilhões, mais dez bilhões menos os segundos da última concessão. Mais pontos sempre ganham, e no empate, quem chegou antes fica na frente.',
    'A sincronização é Write-Through: logo depois do commit da aprovação, a API grava o novo score do membro. Só grava se o placar existir, num script Lua atômico. Sem isso, depois de reiniciar o Redis, o placar teria uma pessoa só.'] },
  { m: 'Redis', t: 'E se o Redis cair?', v: 'v-redisfora', f: [
    'O teste derruba o Redis no meio. A saúde mostra Redis indisponível, mas o ranking e a posição seguem respondendo, com origem postgres.',
    'Uma aprovação com o Redis fora é confirmada no PostgreSQL, e a resposta avisa que o cache não foi atualizado.',
    'Quando o Redis volta, ele volta vazio, porque roda sem disco de propósito. Na primeira leitura, o placar é reconstruído do SQL, já com a aprovação feita durante a queda.',
    'E o script conferir placar compara as cinco mil oitocentas e setenta e seis posições do Redis com o SQL: zero diferenças.'] },
  { m: 'Prova', t: 'Testes que acham erro', v: 'v-testes', f: [
    'Os números dos testes resumem o projeto.',
    'Vinte e cinco operações proibidas recusadas, zero falhas. Uma conclusão e uma pontuação com dois gestores ao mesmo tempo. Zero diferenças entre o Redis e o SQL.',
    'E três erros meus que os testes acharam e que foram corrigidos. Isso é um argumento, não uma vergonha: mostra que o teste existe para pegar erro.',
    'Tudo está guardado na pasta resultados, que também é o seu plano B se algo falhar ao vivo.'] },
  { m: 'Prova', t: 'Os números', v: 'v-numeros', f: [
    'A especificação pede comparação com e sem índice, com e sem cache, e a vazão na demonstração.',
    'O índice leva as vinte entregas mais recentes de cinquenta e três milissegundos para zero vírgula vinte e seis.',
    'O cache leva o top cem de cinquenta e nove milissegundos para quatro vírgula nove, na mediana.',
    'Em vazão, com vinte clientes ao mesmo tempo, o top cem vai de cento e cinquenta e nove para oitocentas e noventa e oito requisições por segundo. A posição do usuário vai de cento e quarenta e oito para mil trezentas e quatro.',
    'Diga com honestidade: são medições locais, tudo na mesma máquina, sem rede no meio.'] },
  { m: 'Simulação da banca', t: 'A abertura, na sua voz', v: 'v-pitch', f: [
    'Agora vamos simular a apresentação. Primeiro, a abertura, como você falaria.',
    'Você: Professor, o EJ Quest resolve um problema que eu vivo na Rocket: a cada gestão, a empresa júnior perde conhecimento. A plataforma organiza trilhas por diretoria, com quizzes e um desafio final avaliado pelo gestor, e cada aprovação vira pontos num ranking.',
    'Você: Para isso usei persistência poliglota. O PostgreSQL é a fonte oficial, com dezesseis tabelas na terceira forma normal, transações, views, procedures e triggers. O Redis guarda só cópias: o top cem em Cache-Aside e o placar em Sorted Set com Write-Through.',
    'Você: Vou mostrar três coisas: o banco recusando o que é proibido, dois gestores aprovando a mesma entrega no mesmo segundo sem gerar ponto duplicado, e os números com e sem índice e cache.'] },
  { m: 'Simulação da banca', t: 'Perguntas da banca, parte 1', v: 'v-banca1', f: [
    'Professor: Por que dois bancos? Um PostgreSQL não daria conta?',
    'Você: Daria em volume: cem mil linhas não deixam o PostgreSQL lento. O Redis entra porque o ranking é uma agregação lida muitas vezes e mudada poucas. Medido: oitocentas e noventa e oito contra cento e cinquenta e nove requisições por segundo.',
    'Professor: Por que Redis e não MongoDB?',
    'Você: O que vai para o NoSQL são valores prontos com prazo de validade e um placar ordenado. Isso é chave-valor e Sorted Set. Não tenho documentos de estrutura variável.',
    'Professor: O que impede ponto duplicado?',
    'Você: Três camadas: o for update na participação, a idempotência da procedure e a chave primária de conclusão e pontuação.',
    'Professor: Mostre a terceira forma normal.',
    'Você: Tentativa e pontuação não guardam o usuário. Ele vem pela participação e pela matrícula. Guardar de novo seria dependência transitiva.'] },
  { m: 'Simulação da banca', t: 'Perguntas da banca, parte 2', v: 'v-banca2', f: [
    'Professor: Qual nível de isolamento você usa?',
    'Você: Read committed, o padrão do PostgreSQL, com bloqueio explícito for update. Serializable também resolveria, mas obrigaria a API a repetir transações.',
    'Professor: Seu sistema pode ter deadlock?',
    'Você: Cada transação trava uma linha só, então não forma ciclo. Se formasse, o PostgreSQL detecta e aborta uma das transações.',
    'Professor: Por que a imutabilidade é trigger e não constraint?',
    'Você: Constraint proíbe valores, não operações. Para proibir update e delete, só uma trigger before.',
    'Professor: E se o Redis cair no meio da aprovação?',
    'Você: A aprovação já está confirmada no PostgreSQL. A resposta avisa que o cache não foi atualizado, e quando o Redis volta, vazio, o placar é reconstruído do SQL.'] },
  { m: 'Simulação da banca', t: 'Recortes: diga antes que perguntem', v: 'v-recortes', f: [
    'Feche a apresentação declarando os recortes. Isso passa segurança.',
    'A identificação pelo cabeçalho não é segurança: é um atalho para focar no banco. Login de verdade, com senha criptografada, entra em Programação Web.',
    'As telas ligadas à API também são a fase de Programação Web: rotas, props, ícones, use state, use effect e axios, exatamente o que o professor de Web pede.',
    'E a carga é sintética: o volume foi escolhido, não observado.'] },
  { m: 'Encerramento', t: 'Como estudar a partir daqui', v: 'v-estudo', f: [
    'Para fechar, o seu caminho até a apresentação.',
    'Releia a revisão geral do manual. Rode a demo do capítulo seis uma vez inteira, com a terceira janela mostrando o bloqueio.',
    'Responda em voz alta, sem olhar, as perguntas da banca. Copie a tabela de números para o slide. E guarde o plano B: as saídas na pasta resultados.',
    'E a regra do projeto continua valendo: o que você não conseguir explicar sai da demo. Boa apresentação, Fideles.'] },
];

// ============================================================ PLAYER
const $ = (id) => document.getElementById(id);
let atual = 0, tocando = false, fila = [], idxFala = 0, vozes = [], timer = null;
const sintese = 'speechSynthesis' in window ? window.speechSynthesis : null;

function montarIndice() {
  const nav = $('indice'); let ultimo = '';
  CENAS.forEach((c, i) => {
    if (c.m !== ultimo) { const h = document.createElement('h3'); h.textContent = c.m; nav.appendChild(h); ultimo = c.m; }
    const b = document.createElement('button'); b.textContent = (i + 1) + '. ' + c.t;
    b.onclick = () => { irPara(i, tocando); }; b.id = 'item-' + i; nav.appendChild(b);
  });
}

function frasesDe(cena) {
  const out = [];
  cena.f.forEach((p) => {
    let quem = null, texto = p;
    const m = p.match(/^(Professor|Você):\s*/);
    if (m) { quem = m[1]; texto = p.slice(m[0].length); }
    (texto.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [texto]).forEach((s) => out.push({ quem, s: s.trim() }));
  });
  return out;
}

function mostrar(i) {
  const c = CENAS[i];
  $('modulo').textContent = c.m + ' · cena ' + (i + 1) + ' de ' + CENAS.length;
  $('titulo').textContent = c.t;
  $('palco').innerHTML = ''; $('palco').appendChild(document.getElementById(c.v).content.cloneNode(true));
  fila = frasesDe(c); idxFala = 0; desenharLegenda();
  document.querySelectorAll('nav button').forEach((b) => b.classList.remove('atual'));
  const it = $('item-' + i); if (it) { it.classList.add('atual'); it.scrollIntoView({ block: 'nearest' }); }
  $('progresso').style.width = ((i + 1) / CENAS.length * 100) + '%';
}

function desenharLegenda() {
  const leg = $('legenda'); leg.innerHTML = '';
  let ultimoQuem = undefined;
  fila.forEach((f, k) => {
    if (f.quem && f.quem !== ultimoQuem) { const q = document.createElement('span'); q.className = 'quem dita'; q.textContent = ' ' + f.quem + ': '; leg.appendChild(q); }
    ultimoQuem = f.quem;
    const s = document.createElement('span'); s.textContent = f.s + ' ';
    s.className = k < idxFala ? 'dita' : (k === idxFala && tocando ? 'falando' : '');
    leg.appendChild(s);
  });
}

function vozEscolhida() { return vozes[$('voz').value] || null; }

function falarProxima() {
  clearTimeout(timer);
  if (!tocando) return;
  if (idxFala >= fila.length) {
    if (atual < CENAS.length - 1) { timer = setTimeout(() => { irPara(atual + 1, true); }, 900); }
    else { pausar(); }
    return;
  }
  desenharLegenda();
  const f = fila[idxFala];
  const vel = Number($('velocidade').value);
  if (sintese && vozes.length) {
    const u = new SpeechSynthesisUtterance(f.s);
    const v = vozEscolhida(); if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'pt-BR'; }
    u.rate = vel;
    u.pitch = f.quem === 'Professor' ? 0.75 : (f.quem === 'Você' ? 1.15 : 1.0);
    u.onend = () => { idxFala++; falarProxima(); };
    u.onerror = () => { idxFala++; falarProxima(); };
    sintese.speak(u);
  } else {
    // sem voz: avança no tempo de leitura (~170 palavras por minuto)
    const ms = Math.max(1500, f.s.split(/\s+/).length / 170 * 60000 / vel);
    timer = setTimeout(() => { idxFala++; falarProxima(); }, ms);
  }
}

function tocar() { tocando = true; $('tocar').textContent = '⏸ Pausar'; if (sintese) sintese.cancel(); falarProxima(); }
function pausar() { tocando = false; $('tocar').textContent = '▶ Tocar'; clearTimeout(timer); if (sintese) sintese.cancel(); desenharLegenda(); }
function irPara(i, continuar) {
  if (i < 0 || i >= CENAS.length) return;
  clearTimeout(timer); if (sintese) sintese.cancel();
  atual = i; mostrar(i);
  try { localStorage.setItem('ejq-videoaula-cena', String(i)); } catch (e) {}
  if (continuar) { tocando = true; $('tocar').textContent = '⏸ Pausar'; setTimeout(falarProxima, 250); }
}

function carregarVozes() {
  if (!sintese) return;
  const todas = sintese.getVoices();
  const pt = todas.filter((v) => /^pt/i.test(v.lang));
  vozes = pt.length ? pt.sort((a, b) => (b.lang === 'pt-BR') - (a.lang === 'pt-BR')) : todas;
  const sel = $('voz'); sel.innerHTML = '';
  if (!vozes.length) { const o = document.createElement('option'); o.textContent = 'sem voz (só legenda)'; sel.appendChild(o); return; }
  vozes.forEach((v, k) => { const o = document.createElement('option'); o.value = k; o.textContent = v.name + ' (' + v.lang + ')'; sel.appendChild(o); });
}

$('tocar').onclick = () => (tocando ? pausar() : tocar());
$('anterior').onclick = () => irPara(atual - 1, tocando);
$('proxima').onclick = () => irPara(atual + 1, tocando);
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); tocando ? pausar() : tocar(); }
  if (e.code === 'ArrowRight') irPara(atual + 1, tocando);
  if (e.code === 'ArrowLeft') irPara(atual - 1, tocando);
});
if (sintese) { carregarVozes(); sintese.onvoiceschanged = carregarVozes; }
montarIndice();
let inicial = 0; try { inicial = Number(localStorage.getItem('ejq-videoaula-cena')) || 0; } catch (e) {}
irPara(Math.min(inicial, CENAS.length - 1), false);
</script>
</body>
</html>
