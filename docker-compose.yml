# Sobe o ambiente inteiro do EJ Quest: PostgreSQL (fonte oficial), Redis (cache do ranking) e a API.
#
#   docker compose up -d          -> sobe tudo
#   docker compose ps             -> confere se está de pé
#   docker compose logs -f api    -> acompanha a API
#   docker compose stop cache     -> derruba só o Redis (teste de queda do cache)
#   docker compose down           -> desliga (os dados do Postgres ficam no volume)
#   docker compose down -v        -> desliga e APAGA o volume (banco zerado)

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 5433 na sua máquina para não brigar com outro Postgres local (ex.: o do Plano Diretor).
      - "5433:5432"
    volumes:
      # Volume nomeado: os dados sobrevivem a "docker compose down".
      - dados_postgres:/var/lib/postgresql/data
      # Seus scripts SQL ficam visíveis dentro do contêiner em /db (só leitura).
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: redis:7
    # Sem persistência em disco: o ranking no Redis é descartável e reconstruível pelo Postgres.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"

  api:
    build: ./api
    environment:
      PORTA: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://cache:6379
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      # O Redis não é condição: a API precisa funcionar mesmo com o cache fora (RNF06).
      cache:
        condition: service_started

volumes:
  dados_postgres:
