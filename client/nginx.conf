server {
  listen 80;
  root /usr/share/nginx/html;

  # /api/... vai para a API (serviço "api" do docker-compose), sem o prefixo /api.
  # O navegador só fala com esta porta; por isso não há problema de CORS.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
  }

  # React Router: qualquer outra rota devolve o index.html e o React decide a tela.
  location / {
    try_files $uri /index.html;
  }
}
